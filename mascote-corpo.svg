      <path d="M120 38L144 18L136 60Q124 64 112 65Q124 50 120 38Z" fill="#3A2A4D" opacity=".16"/>
      <path d="M67 50Q100 62 133 50" fill="none" stroke="#FF6B9D" stroke-width="5" stroke-linecap="round"/>
      <g fill="#FF6B9D" stroke="#3A2A4D" stroke-width="2.5">
        <circle cx="56" cy="18" r="5"/>
        <circle cx="100" cy="8" r="5"/>
        <circle cx="144" cy="18" r="5"/>
      </g>
