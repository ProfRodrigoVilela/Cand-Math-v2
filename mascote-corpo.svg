<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" class="m2d-corpo" role="img" aria-label="Juba Candy">
  <!-- Juba Candy de corpo inteiro. mascote.svg continua sendo o rosto pequeno
       (favicon e ícones). As peças ficam escondidas em data-peca, dentro do seu
       data-encaixe; quem as mostra é mascote-2d.js. Sem id de propósito: o
       desenho aparece mais de uma vez na mesma página. -->
  <style>
    .m2d-corpo .m2d-tinta { fill: var(--m2d-cor, #FF6B9D); }
    .m2d-corpo .m2d-olhos {
      transform-box: fill-box; transform-origin: center;
      animation: m2d-piscar 4.6s infinite;
    }
    .m2d-corpo .m2d-boca-aberta {
      display: none; transform-box: fill-box; transform-origin: center top;
    }
    .m2d-corpo.m2d-falando .m2d-boca-fechada { display: none; }
    .m2d-corpo.m2d-falando .m2d-boca-aberta {
      display: inline; animation: m2d-falar 0.42s ease-in-out infinite;
    }
    .m2d-corpo .m2d-boca-triste { display: none; }
    .m2d-corpo.m2d-feliz { animation: m2d-pular 0.5s ease-out 2; transform-origin: center bottom; }
    .m2d-corpo.m2d-feliz .m2d-boca-fechada { display: none; }
    .m2d-corpo.m2d-feliz .m2d-boca-aberta { display: inline; }
    .m2d-corpo.m2d-triste { animation: m2d-murchar 1.2s ease-in-out; transform-origin: center bottom; }
    .m2d-corpo.m2d-triste .m2d-boca-fechada { display: none; }
    .m2d-corpo.m2d-triste .m2d-boca-triste { display: inline; }
    @keyframes m2d-pular {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      20% { transform: translateY(0) scale(1.06, 0.94); }
      55% { transform: translateY(-9%) scale(0.97, 1.03); }
    }
    @keyframes m2d-murchar {
      0%, 100% { transform: rotate(0) scale(1, 1); }
      25%, 70% { transform: rotate(-4deg) scale(1.02, 0.95); }
    }
    @keyframes m2d-piscar {
      0%, 94%, 100% { transform: scaleY(1); }
      97% { transform: scaleY(0.08); }
    }
    @keyframes m2d-falar {
      0%, 100% { transform: scaleY(0.25); }
      35% { transform: scaleY(1); }
      60% { transform: scaleY(0.55); }
      80% { transform: scaleY(0.9); }
    }
    @media (prefers-reduced-motion: reduce) {
      .m2d-corpo .m2d-olhos, .m2d-corpo.m2d-falando .m2d-boca-aberta,
      .m2d-corpo.m2d-feliz, .m2d-corpo.m2d-triste { animation: none; }
    }
  </style>

  <g data-encaixe="roupa-fundo">
    <g data-peca="out_cape" display="none">
      <path class="m2d-tinta" d="M64 150Q26 226 40 268Q100 288 160 268Q174 226 136 150Z" stroke="#3A2A4D" stroke-width="4" stroke-linejoin="round"/>
      <path d="M136 150Q174 226 160 268Q142 275 122 278Q150 220 120 150Z" fill="#3A2A4D" opacity=".2"/>
    </g>
  </g>

  <g data-parte="cauda" fill="none" stroke-linecap="round">
    <path d="M132 232Q172 240 176 196" stroke="#3A2A4D" stroke-width="20"/>
    <path d="M132 232Q172 240 176 196" stroke="#FFD93D" stroke-width="13"/>
    <path d="M176 203Q177 199 176 196" stroke="#3A2A4D" stroke-width="13"/>
  </g>

  <g data-parte="pernas">
    <g fill="none" stroke-linecap="round">
      <path d="M80 232V268M120 232V268" stroke="#3A2A4D" stroke-width="26"/>
      <path d="M80 232V268M120 232V268" stroke="#FFD93D" stroke-width="19"/>
    </g>
    <g fill="#FFD93D" stroke="#3A2A4D" stroke-width="3.5">
