      <ellipse cx="126" cy="278" rx="23" ry="12"/>
    </g>
    <path d="M60 276h0M70 274h0M136 274h0M146 276h0" stroke="#3A2A4D" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <g data-encaixe="calcado">
    <g data-peca="shoe_social_cacau" display="none">
      <g>
        <path d="M46 284Q46 262 68 262H86Q100 268 100 284Z" fill="#6B4226" stroke="#3A2A4D" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M84 263Q99 268 100 284H88Q90 272 84 263Z" fill="#3A2A4D" opacity=".25"/>
        <rect x="44" y="283" width="58" height="8" rx="4" fill="#FFF8F0" stroke="#3A2A4D" stroke-width="3"/>
        <path d="M66 266l6 7M73 264l6 7" stroke="#FFF8F0" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <g transform="translate(200 0) scale(-1 1)">
        <path d="M46 284Q46 262 68 262H86Q100 268 100 284Z" fill="#6B4226" stroke="#3A2A4D" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M46 284Q46 266 60 263Q54 272 56 284Z" fill="#3A2A4D" opacity=".25"/>
        <rect x="44" y="283" width="58" height="8" rx="4" fill="#FFF8F0" stroke="#3A2A4D" stroke-width="3"/>
        <path d="M66 266l6 7M73 264l6 7" stroke="#FFF8F0" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <g data-parte="tronco">
    <ellipse cx="100" cy="196" rx="44" ry="50" fill="#FFD93D" stroke="#3A2A4D" stroke-width="4"/>
    <ellipse cx="100" cy="204" rx="26" ry="32" fill="#FFF3B0"/>
    <path d="M100 246A44 50 0 0 0 144 196A56 56 0 0 1 100 246Z" fill="#E8A91F" opacity=".55"/>
    <g fill="#3A2A4D">
      <circle cx="68" cy="190" r="4"/>
      <circle cx="134" cy="184" r="3.5"/>
      <circle cx="70" cy="218" r="3"/>
    </g>
  </g>

  <g data-encaixe="roupa">
    <g data-peca="vestido" display="none">
      <path class="m2d-tinta" d="M70 158Q100 174 130 158L136 192Q168 232 168 252Q100 274 32 252Q32 232 64 192Z" stroke="#3A2A4D" stroke-width="4" stroke-linejoin="round"/>
      <path d="M130 158L136 192Q168 232 168 252Q150 258 128 262Q148 214 118 170Z" fill="#3A2A4D" opacity=".18"/>
      <path d="M82 170Q72 200 54 236" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".4"/>
      <path d="M64 192Q100 206 136 192L134 202Q100 216 66 202Z" fill="#FFF8F0" stroke="#3A2A4D" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <g data-peca="out_cape" display="none">
