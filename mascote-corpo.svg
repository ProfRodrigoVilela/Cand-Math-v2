      <g stroke="#3A2A4D" stroke-width="3.5" stroke-linejoin="round">
        <path class="m2d-tinta" fill-opacity=".62" d="M78 114C54 98 52 76 66 76C72 76 77 80 78 85C79 80 84 76 90 76C104 76 102 98 78 114Z"/>
