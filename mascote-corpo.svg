      <circle cx="150" cy="62" r="21" fill="#FFD93D"/>
    </g>
    <circle cx="50" cy="62" r="11" fill="#FF6B9D"/>
    <circle cx="150" cy="62" r="11" fill="#FF6B9D"/>
    <ellipse cx="100" cy="100" rx="60" ry="54" fill="#FFD93D" stroke="#3A2A4D" stroke-width="4"/>
    <path d="M100 154A60 54 0 0 0 160 100A74 66 0 0 1 100 154Z" fill="#E8A91F" opacity=".55"/>
    <g fill="#3A2A4D">
      <circle cx="100" cy="60" r="4.5"/>
      <circle cx="80" cy="66" r="3.5"/>
      <circle cx="120" cy="66" r="3.5"/>
    </g>
    <circle cx="58" cy="116" r="9" fill="#FF6B9D" opacity=".45"/>
    <circle cx="142" cy="116" r="9" fill="#FF6B9D" opacity=".45"/>

    <g class="m2d-olhos">
      <circle cx="78" cy="94" r="9.5" fill="#3A2A4D"/>
      <circle cx="122" cy="94" r="9.5" fill="#3A2A4D"/>
      <circle cx="81" cy="90" r="3.2" fill="#fff"/>
      <circle cx="125" cy="90" r="3.2" fill="#fff"/>
    </g>

    <ellipse cx="100" cy="124" rx="28" ry="20" fill="#fff" stroke="#3A2A4D" stroke-width="3"/>
    <path d="M92 110h16l-8 9z" fill="#FF4D8F" stroke="#3A2A4D" stroke-width="2" stroke-linejoin="round"/>
    <g class="m2d-boca-fechada">
      <path d="M100 119v6M86 126Q100 138 114 126" fill="none" stroke="#3A2A4D" stroke-width="3" stroke-linecap="round"/>
